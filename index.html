<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMate</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>💰 MoneyMate</h1>
<div class="total-card">
    <p>今月の支出</p>
    <h2 id="total">¥0</h2>
</div>
<div class="card">

<input type="date" id="date">

<input type="text" id="item" placeholder="内容">

<input type="number" id="price" placeholder="金額">

<select id="category">
<option>食費</option>
<option>交通費</option>
<option>趣味</option>
<option>その他</option>
</select>

<button onclick="add()">追加</button>

</div>

<h2>記録</h2>

<ul id="list"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
