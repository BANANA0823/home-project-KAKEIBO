<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMate</title>

<link rel="stylesheet" href="style.css">
</head>
<script>
function bananaRain() {
    for (let i = 0; i < 20; i++) {
        const banana = document.createElement("div");

        banana.textContent = "🍌";
        banana.style.position = "fixed";
        banana.style.left = Math.random() * 100 + "vw";
        banana.style.top = "-50px";
        banana.style.fontSize = (25 + Math.random() * 25) + "px";
        banana.style.zIndex = "9999";
        banana.style.pointerEvents = "none";

        const duration = 1.5 + Math.random() * 2;

        banana.style.transition = `top ${duration}s linear, transform ${duration}s linear`;
        document.body.appendChild(banana);

        setTimeout(() => {
            banana.style.top = "110vh";
            banana.style.transform =
                `rotate(${Math.random() * 720 - 360}deg)`;
        }, 50);

        setTimeout(() => {
            banana.remove();
        }, duration * 1000 + 200);
    }
}
</script>
<body>

<div class="container">

<h1>💰 MoneyMate</h1>
<div class="total-card">
    <p>今月の支出</p>
    <h2 id="total">¥0</h2>
</div>
<div class="card">

<input type="date" id="date">

<input type="text" id="item" placeholder="内容">

<input type="number" id="price" placeholder="金額">

<select id="category">
<option>食費</option>
<option>交通費</option>
<option>趣味</option>
<option>その他</option>
</select>

<button onclick="add()">追加</button>

</div>

<h2>記録</h2>

<ul id="list"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
