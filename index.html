<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banana money record 🍌</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#fff8d6;
    margin:0;
    color:#333;
    overflow-x:hidden;
}

/* 🍌 バナナ背景 */
body::before{
    content:"🍌   🍌        🍌   🍌\A"
            "     🍌       🍌       🍌\A"
            "🍌       🍌          🍌\A"
            "      🍌    🍌   🍌\A"
            "🍌          🍌       🍌";

    white-space:pre;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    font-size:38px;
    line-height:150px;
    opacity:0.13;
    pointer-events:none;
    z-index:-1;
}

/* 全体 */
.container{
    max-width:400px;
    margin:20px auto;
    padding:20px;
}

/* タイトル */
h1{
    text-align:center;
    color:#5b3a00;
    font-size:32px;
    margin-bottom:20px;
}

/* 入力カード */
.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.12);
}

/* ラベル */
label{
    display:block;
    margin-top:12px;
    font-weight:bold;
    color:#5b3a00;
}

/* 入力欄・選択欄・ボタン */
input,
select,
button{
    width:100%;
    height:42px;
    padding:10px;
    margin-top:8px;
    box-sizing:border-box;
    font-size:16px;
    border-radius:8px;
}

/* 日付 */
input[type="date"]{
    width:100%;
    min-width:0;
    max-width:100%;
    height:42px;
    box-sizing:border-box;
    display:block;
}

/* 入力欄 */
input,
select{
    border:2px solid #ffe36e;
    background:#fffdf2;
}

/* 追加ボタン */
button{
    margin-top:18px;
    background:#69c34a;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#55ad38;
}

/* 合計金額 */
#total{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#6b4500;
    background:#ffe66d;
    padding:15px;
    border-radius:18px;
    margin-top:20px;
}

/* 記録一覧 */
ul{
    list-style:none;
    padding:0;
}

li{
    background:white;
    margin-top:10px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

h2{
    color:#5b3a00;
}

/* =========================
   🍌 降ってくるバナナ
   ========================= */

.falling-banana{
    position:fixed;
    top:-70px;
    z-index:9999;
    pointer-events:none;
    font-size:38px;

    animation-name:bananaFall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
}

@keyframes bananaFall{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }

    50%{
        transform:translateY(50vh) rotate(180deg);
    }

    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* 合計金額の演出 */
.success{
    animation:successPop 0.35s ease;
}

@keyframes successPop{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

</style>
</head>


<body>

<div class="container">

    <h1>🍌 ばなな家計簿 🍌</h1>


    <div class="card">

        <label>📅 日付</label>
        <input type="date" id="date">


        <label>💰 何に使った？</label>

        <select id="item">

            <option value="">選んでね</option>

            <option value="🍙 ごはん">
                🍙 ごはん
            </option>

            <option value="🍬 お菓子">
                🍬 お菓子
            </option>

            <option value="🥤 飲み物">
                🥤 飲み物
            </option>

            <option value="🎮 ゲーム">
                🎮 ゲーム
            </option>

            <option value="🛍️ 買い物">
                🛍️ 買い物
            </option>

            <option value="🚃 交通費">
                🚃 交通費
            </option>

            <option value="🎬 遊び">
                🎬 遊び
            </option>

            <option value="📱 サブスク">
                📱 サブスク
            </option>

            <option value="🍌 その他">
                🍌 その他
            </option>

        </select>


        <label>💴 いくら使った？</label>

        <input
            type="number"
            id="price"
            placeholder="例：500"
        >


        <button onclick="addRecord()">
            🍌 お金を使った！
        </button>

    </div>


    <div id="total">
        合計：0円
    </div>


    <h2>📖 記録一覧</h2>

    <ul id="recordList"></ul>

</div>


<script>

/* =========================
   家計簿
   ========================= */

let total = 0;


/* 今日の日付を自動入力 */

document.getElementById("date").value =
    new Date().toISOString().split("T")[0];


/* =========================
   🍌 バナナを降らせる
   ========================= */

function bananaRain(){

    for(let i = 0; i < 15; i++){

        const banana =
            document.createElement("div");

        banana.className =
            "falling-banana";

        banana.textContent =
            "🍌";


        /* 横位置ランダム */

        banana.style.left =
            Math.random() * 100 + "vw";


        /* 大きさランダム */

        banana.style.fontSize =
            (25 + Math.random() * 30) + "px";


        /* 落ちる速度ランダム */

        banana.style.animationDuration =
            (1.5 + Math.random() * 2) + "s";


        /* 落ち始める時間を少しずらす */

        banana.style.animationDelay =
            (Math.random() * 0.8) + "s";


        document.body.appendChild(banana);


        /* 落ち終わったら削除 */

        setTimeout(() => {

            banana.remove();

        }, 4000);

    }

}


/* =========================
   💰 お金を追加
   ========================= */

function addRecord(){

    const date =
        document.getElementById("date").value;

    const item =
        document.getElementById("item").value;

    const price =
        Number(
            document.getElementById("price").value
        );


    /* 入力チェック */

    if(!date){

        alert("日付を選んでね🍌");

        return;
    }


    if(!item){

        alert("何に使ったか選んでね🍌");

        return;
    }


    if(!price || price <= 0){

        alert("金額を入力してね🍌");

        return;
    }


    /* 合計金額 */

    total += price;


    document.getElementById("total").textContent =
        "合計：" +
        total.toLocaleString() +
        "円";


    /* 記録 */

    const li =
        document.createElement("li");


    li.innerHTML =
        "📅 " + date + "<br>" +
        "💰 " + item + "<br>" +
        "💴 " + price.toLocaleString() + "円";


    document
        .getElementById("recordList")
        .appendChild(li);


    /* 🍌 バナナ発生！！ */

    bananaRain();


    /* 合計をポンッ */

    const totalBox =
        document.getElementById("total");

    totalBox.classList.remove("success");

    void totalBox.offsetWidth;

    totalBox.classList.add("success");


    /* 金額を空にする */

    document.getElementById("price").value = "";


    /* 選択を最初に戻す */

    document.getElementById("item").value = "";

}

</script>

</body>
</html>
