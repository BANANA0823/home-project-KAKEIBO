<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banana money record 🍌</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#fff8d6;
    margin:0;
    color:#333;
    overflow-x:hidden;
}

/* 🍌 バナナ背景 */
body::before{
    content:"🍌   🍌        🍌   🍌\A"
            "     🍌       🍌       🍌\A"
            "🍌       🍌          🍌\A"
            "      🍌    🍌   🍌\A"
            "🍌          🍌       🍌";

    white-space:pre;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    font-size:38px;
    line-height:150px;
    opacity:0.13;
    pointer-events:none;
    z-index:-1;
}

/* 全体 */
.container{
    max-width:400px;
    margin:20px auto;
    padding:20px;
}

/* タイトル */
h1{
    text-align:center;
    color:#5b3a00;
    font-size:32px;
    margin-bottom:20px;
}

/* 入力カード */
.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.12);
}

/* ラベル */
label{
    display:block;
    margin-top:12px;
    font-weight:bold;
    color:#5b3a00;
}

/* 入力欄・選択欄・ボタン */
input,
select,
button{
    width:100%;
    height:42px;
    padding:10px;
    margin-top:8px;
    box-sizing:border-box;
    font-size:16px;
    border-radius:8px;
}

/* 日付 */
input[type="date"]{
    width:100%;
    min-width:0;
    max-width:100%;
    height:42px;
    box-sizing:border-box;
    display:block;
}

/* 入力欄 */
input,
select{
    border:2px solid #ffe36e;
    background:#fffdf2;
}

/* 追加ボタン */
button{
    margin-top:18px;
    background:#69c34a;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#55ad38;
}

/* 合計金額 */
#total{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#6b4500;
    background:#ffe66d;
    padding:15px;
    border-radius:18px;
    margin-top:20px;
}

/* 記録一覧 */
ul{
    list-style:none;
    padding:0;
}

li{
    background:white;
    margin-top:10px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

h2{
    color:#5b3a00;
}
