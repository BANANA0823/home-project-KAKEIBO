<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ばなな家計簿 🍌</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🍌 背景 -->
<div class="banana-bg">🍌</div>

<div class="container">

    <h1>🍌 ばなな家計簿 🍌</h1>

    <!-- 入力カード -->
    <div class="card">

        <label>📅 日付</label>
        <input type="date" id="date">

        <label>💰 何に使った？</label>
        <select id="item">
            <option value="">選んでね</option>
            <option value="🍙 ごはん">🍙 ごはん</option>
            <option value="🍬 お菓子">🍬 お菓子</option>
            <option value="🥤 飲み物">🥤 飲み物</option>
            <option value="🎮 ゲーム">🎮 ゲーム</option>
            <option value="🛍️ 買い物">🛍️ 買い物</option>
            <option value="🚃 交通費">🚃 交通費</option>
            <option value="🎬 遊び">🎬 遊び</option>
            <option value="📱 サブスク">📱 サブスク</option>
            <option value="🍌 その他">🍌 その他</option>
        </select>

        <label>💴 いくら使った？</label>
        <input
            type="number"
            id="price"
            placeholder="例：500"
            min="1"
        >

        <button id="addButton">
            🍌 お金を使った！
        </button>

    </div>

    <!-- 合計 -->
    <div id="total">
        合計：0円
    </div>

    <!-- 🍌 バナナゲージ -->
    <div class="banana-meter">
        <div class="meter-title">🍌 今月のバナナメーター</div>

        <div class="meter-bar">
            <div id="meterFill"></div>
        </div>

        <div id="meterText">
            0円使った！
        </div>
    </div>

    <!-- カテゴリー -->
    <div class="summary-card">

        <h2>📊 使ったものランキング</h2>

        <div id="categoryList">
            まだ記録がないよ🍌
        </div>

    </div>

    <!-- 記録一覧 -->
    <h2>📖 記録一覧</h2>

    <ul id="recordList"></ul>

</div>

<!-- 🎰 演出 -->
<div id="effect"></div>

<script src="script.js"></script>

</body>
</html>
